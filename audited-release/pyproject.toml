[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-debate"
version = "0.1.0"
description = "disagreement resolution protocols"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
]

[project.scripts]
agent-run = "run:main"
agent-acc = "acc:main"

[tool.setuptools]
py-modules = ["run", "acc"]

[tool.poetry]
package-mode = false
